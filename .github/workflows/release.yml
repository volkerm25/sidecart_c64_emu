name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # The same toolchain and toolkit as the Build workflow and local builds.
  ARM_TOOLCHAIN_VERSION: 14.2.rel1
  STCMD_NO_TTY: 1

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: [ "3.10" ]
        include:
          - os: ubuntu-latest
    steps:
    - name: Checkout the code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install the build tools
      run: |
          sudo DEBIAN_FRONTEND=noninteractive apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install -y cmake build-essential

    - name: Cache the ARM GNU Toolchain
      id: arm-toolchain
      uses: actions/cache@v4
      with:
        path: ~/arm-gnu-toolchain
        key: arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64

    - name: Download the ARM GNU Toolchain
      if: steps.arm-toolchain.outputs.cache-hit != 'true'
      run: |
          mkdir -p ~/arm-gnu-toolchain
          curl -fsSL "https://developer.arm.com/-/media/Files/downloads/gnu/${ARM_TOOLCHAIN_VERSION}/binrel/arm-gnu-toolchain-${ARM_TOOLCHAIN_VERSION}-x86_64-arm-none-eabi.tar.xz" \
            | tar -xJ -C ~/arm-gnu-toolchain --strip-components=1

    - name: Use the ARM GNU Toolchain
      run: |
          echo "$HOME/arm-gnu-toolchain/bin" >> "$GITHUB_PATH"
          echo "PICO_TOOLCHAIN_PATH=$HOME/arm-gnu-toolchain/bin" >> "$GITHUB_ENV"

    - name: Install AtariST Toolkit Docker image
      run: curl -sL https://github.com/sidecartridge/atarist-toolkit-docker/releases/download/v1.2.1/install_atarist_toolkit_docker.sh | bash

    - name: Date the build by its commit
      run: echo "RELEASE_DATE=$(git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"

    # The Makefile's release target carries the app's UUID and the 250 MHz
    # and 1.15 V the emulator needs.
    - name: Run - Build PICO_W release version
      run: make release

    - name: Get current date
      id: build
      run: echo "::set-output name=date::$(date -u +"%Y-%m-%d %H:%M:%S UTC")"

    - name: Get version from version.txt
      id: get_version
      run: echo "RELEASE_VERSION=$(cat version.txt)" >> $GITHUB_ENV

    # The newest version's section: from its heading to the next one.
    - name: Read partial CHANGELOG.md content
      id: changelog
      run: |
        echo "CHANGELOG<<EOF" >> $GITHUB_ENV
        awk '/^## / { if (seen) exit; seen = 1 } seen { print }' CHANGELOG.md >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    # apps.json, for the SidecarTridge store, goes with every release; the
    # store reads it at releases/latest/download/apps.json. The last
    # release's list gives previous_versions.
    - name: Copy release artifacts
      run: |
        mkdir -p release
        cp dist/*.uf2 release/
        cp dist/*.json release/
        curl -fsSL "https://github.com/${{ github.repository }}/releases/latest/download/apps.json" \
          -o previous-apps.json || rm -f previous-apps.json
        python3 tools/make_apps_json.py dist/*-*-*-*-*.json previous-apps.json release/apps.json

    - name: Upload the binaries to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: release/*
        tag: ${{ github.ref }}
        release_name: ${{ env.RELEASE_VERSION }}
        body: |
          **Release Notes:**
          - Build Date: ${{ steps.build.outputs.date }}
          - Version: ${{ env.RELEASE_VERSION }}

          ${{ env.CHANGELOG }}
        file_glob: true
        overwrite: true
        make_latest: true
